<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luker 插件模拟环境</title>
<link rel="stylesheet" href="style.css">
<style>
:root {
  --SmartThemeBodyColor: #0f172a;
  --SmartThemeBorderColor: #e2e8f0;
  --SmartThemeBlurTintColor: #ffffff;
  --SmartThemeEmColor: #059669;
  --SmartThemeQuoteColor: #047857;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f1f5f9;
  color: #0f172a;
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
  display: flex;
  height: 100vh;
}
#sidebar {
  width: 260px;
  background: #ffffff;
  border-right: 1px solid #e2e8f0;
  display: flex;
  flex-direction: column;
}
.sidebar-header {
  padding: 16px 20px;
  border-bottom: 1px solid #e2e8f0;
  font-weight: 700;
  font-size: 15px;
  color: #0f172a;
}
#chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  max-width: 920px;
  margin: 0 auto;
  border-left: 1px solid #e2e8f0;
  border-right: 1px solid #e2e8f0;
  height: 100vh;
}
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.mes {
  padding: 14px 18px;
  border-radius: 12px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  max-width: 85%;
}
.mes.user {
  background: #ecfdf5;
  border-color: #a7f3d0;
  align-self: flex-end;
}
.mes-author {
  font-weight: 600;
  margin-bottom: 6px;
  font-size: 13px;
  color: #047857;
}
.mes_text {
  font-size: 14px;
  line-height: 1.6;
}
#composer {
  padding: 16px 20px;
  border-top: 1px solid #e2e8f0;
  background: #ffffff;
}
#send_textarea {
  width: 100%;
  height: 76px;
  padding: 10px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  font: inherit;
  resize: none;
  font-size: 14px;
}
#send_textarea:focus {
  outline: none;
  border-color: #059669;
  box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
}
#attach_file_wand_container {
  display: flex;
  gap: 8px;
}
.list-group-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 8px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: #334155;
  transition: all 0.15s ease;
}
.list-group-item:hover {
  background: #ecfdf5;
  border-color: #059669;
  color: #047857;
}
#send-btn {
  background: #059669;
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 7px 20px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
#nonQRFormItems {
  display: none;
}
dialog {
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 24px 28px;
  max-width: min(920px, 94vw);
  max-height: 88vh;
  box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.15);
  background: #ffffff;
}
dialog::backdrop {
  background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(8px);
}
dialog footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid #e2e8f0;
}
</style>
</head>
<body>
<div id="sidebar">
  <div class="sidebar-header">Luker 助手</div>
  <div style="padding: 16px; color: #64748b; font-size: 13px;">💬 会话历史</div>
</div>
<div id="chat-container">
  <div id="messages">
    <div class="mes">
      <div class="mes-author">Gemini 2.0 Flash</div>
      <div class="mes_text">你好！我是你的 AI 助手。你可以通过下方单个“文件库”入口添加视频、音频或文档到本轮对话。</div>
    </div>
    <div class="mes user">
      <div class="mes-author" style="color:#0f172a;">你</div>
      <div class="mes_text">请帮我分析下面这个视频的内容与剪辑建议。</div>
      <div class="gcs-video-message gcs-video-badge" style="margin-top:8px;">
        <span style="display:inline-flex;align-items:center;gap:6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 17.96 8.8l-8.58 8.57a2 2 0 0 1-2.83-2.83l7.87-7.87"/></svg> project_showcase_final_render_4k_hdr.mp4 · 184 秒 · 文件仅本轮</span>
        <button type="button" class="menu_button gcs-primary" style="margin-left:auto;">再次附加</button>
      </div>
    </div>
  </div>
  <div id="composer">
    <div id="nonQRFormItems"></div>
    <div id="gcs-video-pending" class="gcs-video-badge" style="margin-bottom:10px;">
      <span style="display:inline-flex;align-items:center;gap:6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 17.96 8.8l-8.58 8.57a2 2 0 0 1-2.83-2.83l7.87-7.87"/></svg> sample_podcast_episode_42.mp3 · 1420 秒 · 仅本轮</span>
      <button type="button" class="menu_button danger" style="margin-left:auto;">取消附件</button>
    </div>
    <textarea id="send_textarea" placeholder="输入消息，或通过附件菜单打开文件库…"></textarea>
    <div class="toolbar">
      <div id="attach_file_wand_container">
        <div class="list-group-item" id="gcs-video-library">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#059669;"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path><path d="M12 11v6"></path><path d="m9 14 3-3 3 3"></path></svg>
          <span>文件库</span>
        </div>
      </div>
      <button id="send-btn">发送</button>
    </div>
  </div>
</div>
</body>
</html>
